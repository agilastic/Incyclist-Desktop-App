<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Incyclist</title>
	 <link rel="stylesheet" type="text/css" href="./loading.css">
  </head>
  <body>
		<script>
			var ipc = require('electron').ipcRenderer;
			
			function sendReload() {
				ipc.send('retry-page-event', 'reload')
			}
			function sendClose() {
				ipc.send('retry-page-event', 'close')
			}	
		</script>
		<div class="hero"></div>
		<div class="shade"></div>

		<main class="panel">
			<div class="brand">Incyclist</div>
			<div class="error">Failed Loading</div>
			<div class="buttons">
				<button class="btn" onclick="sendReload()">Retry</button>
				<button class="btn btn-secondary" onclick="sendClose()">Close</button>
			</div>
		</main>
  </body>
</html>
